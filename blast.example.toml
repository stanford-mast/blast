port = 7240                 # the local API listens on 0.0.0.0:<port>; set [api] token
data_dir = "/var/lib/blast"  # also holds worker_id, this worker's identity in a pool, and
                             # snapshots/, the local copy of every suspended VM

[backend]
kind = "smolvm"       # recommended: libkrun-based microVMs, real hardware-isolated
binary = "smolvm"     # memory snapshotting (fork/snapshot/restore) via fork_snapshot/resume.
                       # Bare "smolvm" resolves via PATH; use an absolute path if it isn't on it.

# [backend]
# kind = "docker"     # uses Docker daemon on this host; snapshot is commit-based, not a
#                      # real memory snapshot

# [backend]
# kind = "hypeman"
# endpoint = "http://localhost:4973"
# token = "eyJhbGciOi..."   # a hypeman JWT; mint one with hypeman's `gen-jwt` tool
#                            # (JWT_SECRET=... gen-jwt -user-id blast -duration 720h),
#                            # or see hypeman's own docs for issuing longer-lived tokens.
# cli_binary = "hypeman"     # path to the hypeman CLI, used for run() (exec has no
#                            # plain REST endpoint, only a WebSocket one the CLI drives).
#                            # Bare "hypeman" resolves via PATH; use an absolute path
#                            # if it isn't on it.

[api]
# Bearer token required on the local API (every route but /v1/live). Unset
# means anyone who can reach the port can drive this worker's VMs, so leave it
# unset only behind your own network boundary. Requests that arrive over the
# worker tunnel are not checked: only the control plane can send them.
# token = "change-me"

[worker]
# Set these fields to join a remote pool. Without them, BLAST uses its embedded
# local control plane.
control_plane_endpoint = "https://control-plane.example.com"   # the pool's regional endpoint
api_key = "<join key>"                                          # the pool's join key (scope pool:<uuid>:join)
pool_id = "00000000-0000-0000-0000-000000000000"
# platform = "icelake"     # a class of your own (e.g. a CPU model) added to the platform
#                          # BLAST names from backend, OS and arch. `--platform` wins.
# drain_timeout_secs = 300   # on SIGTERM or `blast leave`, how long to let in-flight runs
#                            # and snapshot copies finish
#
# Where suspended VMs' snapshots are kept durably, so a VM survives a restart
# and can resume on another worker of the pool running the same backend. By
# default, the bucket and short-lived credentials the control plane sends with
# every heartbeat response; set storage_dir to keep them yourself instead:
# storage_dir = "/mnt/blast-snapshots"   # local restart durability by default
# storage_dir_shared = true              # only for a mount shared by every worker, such as s3fs
#                                        # mount of your own bucket.
# object_storage_endpoint = "http://127.0.0.1:9000"   # S3-compatible server (path-style); default AWS S3

# Total pool this worker makes available for VMs + snapshots, and the capacity
# it advertises to the control plane. Leave the whole section out to run unlimited (no local
# admission control); a connected worker then advertises the host's own size.
[resources]
vcpu = 8
memory_mib = 16384
disk_mib = 102400
admission_queue_secs = 120   # how long a fork waits for pool headroom before giving up

[lifecycle]
pause_ttl_secs   = 60      # idle before pausing   (CPU freed)
suspend_ttl_secs = 300     # idle before suspending (CPU + memory freed; snapshot kept on disk)

vcpu_pressure_thresh   = 0.15   # pause early when free pool vcpu < 15%
memory_pressure_thresh = 0.15   # suspend early when free pool memory < 15%
