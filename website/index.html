<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLAST</title>
    <!--
      Mirrors the legacy static index.html kept alongside the Next.js app in
      the reference structure (this file is not part of the `next build`
      output -- the GitHub Pages workflow publishes website/out/ -- but the
      convention is mirrored for exact structural parity). Colors and timing
      pulled from arker.ai (cloudflare/src/app/globals.css / page.tsx):
      --page #121212, --marketing-text #fafafa, --marketing-secondary #c8c8c8,
      --surface #1c1c1d, --surface-hover #262626, --brand #f2ff2d,
      50ms hover transition, zero border-radius everywhere.
    -->
    <style>
        :root {
            --page: #121212;
            --surface: #1c1c1d;
            --surface-hover: #262626;
            --text: #fafafa;
            --text-secondary: #c8c8c8;
            --brand: #f2ff2d;
        }

        * {
            border-radius: 0;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--page);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .wordmark {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 2rem;
        }

        .wordmark img {
            width: 9rem;
            height: 9rem;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .tagline {
            font-size: 1.0625rem;
            margin: 0 0 3rem;
            max-width: 34rem;
            color: var(--text-secondary);
        }

        .links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 0.75rem;
        }

        .link {
            display: inline-flex;
            align-items: center;
            gap: 0.625rem;
            padding: 0.75rem 1.5rem;
            text-decoration: none;
            color: var(--text-secondary);
            background-color: var(--surface);
            font-weight: 600;
            font-size: 0.9rem;
            transition: background-color 50ms ease-out, color 50ms ease-out;
        }

        .link:hover {
            background-color: var(--surface-hover);
            color: var(--text);
        }

        .link svg {
            width: 16px;
            height: 16px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="wordmark">
            <img src="/blast_icon_only.svg" alt="BLAST">
        </div>
        <h1 class="sr-only">BLAST</h1>

        <p class="tagline">Open-source VMs-as-a-service</p>

        <div class="links">

                    <path d="M14 3v5.5a.5.5 0 0 0 .5.5H20"/>
                    <path d="M8 13h8M8 17h5"/>
                </svg>

                </svg>

        </div>
    </div>
</body>
</html>
