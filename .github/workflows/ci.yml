name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  neutral-names:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No vendor names in tracked files
        run: ./scripts/check-neutral-names.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test

  target-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build native binary
        run: cargo build --bin blast
      - name: Run native Rust tests
        run: cargo test --bin blast
      - name: Run connected-worker process test
        if: matrix.os == 'windows-latest'
        run: python tests/membership-fence.py target/debug/blast.exe
