[package]
name = "blast_core"
version = "0.1.2"
edition = "2021"
description = "Open-source VMs-as-a-service: local sandbox orchestration over SmolVM, Hypeman, and Docker"
license = "MIT"
repository = "https://github.com/stanford-mast/blast"

[[bin]]
name = "blast"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid = "1"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
urlencoding = "2"
config = "0.14"
which = "6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

[workspace]
