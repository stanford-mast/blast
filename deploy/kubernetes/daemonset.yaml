apiVersion: v1
kind: Namespace
metadata:
  name: blast-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: blast
  namespace: blast-system
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: blast
  namespace: blast-system
data:
  blast.toml: |
    port = 7240
    data_dir = "/var/lib/blast"

    [backend]
    kind = "smolvm"
    binary = "/usr/local/bin/smolvm"

    [worker]
    control_plane_endpoint = "https://control-plane.example.com"
    pool_id = "00000000-0000-0000-0000-000000000000"
    drain_timeout_secs = 600

    [resources]
    vcpu = 8
    memory_mib = 14336
    disk_mib = 102400
    admission_queue_secs = 120

    [lifecycle]
    pause_ttl_secs = 60
    suspend_ttl_secs = 300
    vcpu_pressure_thresh = 0.15
    memory_pressure_thresh = 0.15
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: blast
  namespace: blast-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: blast
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: blast
      annotations:
        cluster-autoscaler.kubernetes.io/safe-to-evict: "false"
    spec:
      serviceAccountName: blast
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 900
      nodeSelector:
        blastproject.org/worker: "true"
      tolerations:
        - key: blastproject.org/worker
          operator: Equal
          value: "true"
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: blast
          image: ghcr.io/example/blast-smolvm:replace-with-an-immutable-digest
          imagePullPolicy: IfNotPresent
          args: ["--config", "/etc/blast/blast.toml"]
          env:
            - name: BLAST__WORKER__API_KEY
              valueFrom:
                secretKeyRef:
                  name: blast-pool
                  key: join-key
            - name: BLAST__API__TOKEN
              valueFrom:
                secretKeyRef:
                  name: blast-pool
                  key: local-api-token
          ports:
            - name: local-api
              containerPort: 7240
              protocol: TCP
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - test /var/lib/blast/worker_incarnation -nt /proc/1
            periodSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "8"
              memory: 14Gi
            limits:
              cpu: "8"
              memory: 16Gi
              devices.kubevirt.io/kvm: "1"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: config
              mountPath: /etc/blast
              readOnly: true
            - name: data
              mountPath: /var/lib/blast
            - name: machine-id
              mountPath: /etc/machine-id
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: blast
        - name: data
          hostPath:
            path: /var/lib/blast
            type: Directory
        - name: machine-id
          hostPath:
            path: /etc/machine-id
            type: File
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: blast
  namespace: blast-system
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: blast
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: blast-outbound-only
  namespace: blast-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: blast
  policyTypes: [Ingress, Egress]
  ingress: []
  egress:
    - {}
